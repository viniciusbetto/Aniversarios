<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Importante para funcionamento responsivo e com icone no celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Aniversários">
    <link rel="manifest" href="manifest.json">

    <title>Aniversariantes</title>
    <!-- Nosso CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container-app">
        <!-- ============================================
             TELA PRINCIPAL
             ============================================ -->
        <section id="telaPrincipal" class="tela">
            <div class="card-principal">
                <!-- Título -->
                <div class="cabecalho-card">
                    <h1>🎂 Aniversariantes</h1>
                    <button id="btnTodos"
                            class="btn-outline">
                        VER TODOS
                    </button>
                </div>
                <!-- Filtros -->
                <div class="filtros">
                    <div class="campo-filtro">
                        <label for="selectMesPrincipal">
                            Mês
                        </label>
                        <select id="selectMesPrincipal">
                            <option value="1">JANEIRO</option>
                            <option value="2">FEVEREIRO</option>
                            <option value="3">MARÇO</option>
                            <option value="4">ABRIL</option>
                            <option value="5">MAIO</option>
                            <option value="6">JUNHO</option>
                            <option value="7">JULHO</option>
                            <option value="8">AGOSTO</option>
                            <option value="9">SETEMBRO</option>
                            <option value="10">OUTUBRO</option>
                            <option value="11">NOVEMBRO</option>
                            <option value="12">DEZEMBRO</option>
                        </select>
                    </div>
                </div>

                <!-- Lista de aniversariantes do mês -->
                <div id="listaAniversariantes"
                     class="lista-aniversariantes">
                    <!-- Preenchida pelo JavaScript -->
                
                </div>
            </div>
        </section>

        <!-- ============================================
             TELA TODOS
             ============================================ -->
        <section id="telaTodos"
                 class="tela oculto">
            <div class="cabecalho-pagina">
                <h1>🎂 Todos os Aniversariantes</h1>
                <div class="grupo-botoes">
                    <button id="btnNovo"
                            class="bt-custom"
                            style="--btn-width: 90px;">
                        NOVO
                    </button>
                    <button id="btnVoltarPrincipal"
                            class="btn-outline"
                            style="--btn-width: 90px;">
                        VOLTAR
                    </button>

                    <button id="btnExportar"
                            class="btn-outline"
                            style="--btn-width: 120px;">
                        EXPORTAR
                    </button>

                    <button id="btnImportar"
                            class="btn-outline"
                            style="--btn-width: 120px;">
                        IMPORTAR
                    </button>

                </div>
            </div>

            <!-- Arquivo usado pela rotina de importação -->
            <input type="file"
                   id="inputArquivoJson"
                   accept=".json,application/json"
                   style="display: none;">

            <!-- Busca -->
            <div class="area-busca">
                <input type="text"
                       id="inputBusca"
                       placeholder="🔎 Buscar aniversariante...">
            </div>

            <!-- Tabela -->
            <div class="tabela-container">
                <table class="cantosTabela">
                    <thead>
                        <tr class="listaTabela">
                            <th id="ordenarNome"
                                class="coluna-ordenavel">
                                NOME ?
                            </th>
                            <th id="ordenarDia"
                                class="coluna-ordenavel text-center">
                                DIA ?
                            </th>
                            <th id="ordenarMes"
                                class="coluna-ordenavel text-center">
                                MÊS ?
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaTodos">
                        <!-- Será preenchida pelo JavaScript -->

                    </tbody>
                </table>
            </div>
        </section>

        <!-- ============================================
             TELA NOVO / EDITAR
             ============================================ -->
        <section id="telaFormulario"
                 class="tela oculto">
            <div class="cabecalho-pagina">
                <h1 id="tituloFormulario">
                    Novo Aniversariante
                </h1>
                <div class="grupo-botoes">
                    <button id="btnGravar"
                            class="bt-custom"
                            style="--btn-width: 90px;">
                        GRAVAR
                    </button>
                    <button id="btnExcluir"
                            class="bt-excluir"
                            style="--btn-width: 90px;">
                        EXCLUIR
                    </button>
                    <button id="btnVoltarLista"
                            class="btn-outline"
                            style="--btn-width: 90px;">
                        VOLTAR
                    </button>
                </div>
            </div>

            <!-- Formulário -->
            <div class="formulario">
                <div class="campo-formulario">
                    <label for="inputNome">
                        Nome
                    </label>

                    <input type="text"
                           id="inputNome"
                           data-maiusculo
                           placeholder="Digite o nome">
                </div>
                <div class="campo-formulario campo-dia">
                    <label for="inputDia">
                        Dia
                    </label>
                    <input type="number"
                           id="inputDia"
                           min="1"
                           max="31"
                           placeholder="Dia">

                </div>
                <div class="campo-formulario">
                    <label for="selectMes">
                        Mês
                    </label>
                    <select id="selectMes">
                        <option value="">Selecione o mês</option>
                        <option value="1">JANEIRO</option>
                        <option value="2">FEVEREIRO</option>
                        <option value="3">MARÇO</option>
                        <option value="4">ABRIL</option>
                        <option value="5">MAIO</option>
                        <option value="6">JUNHO</option>
                        <option value="7">JULHO</option>
                        <option value="8">AGOSTO</option>
                        <option value="9">SETEMBRO</option>
                        <option value="10">OUTUBRO</option>
                        <option value="11">NOVEMBRO</option>
                        <option value="12">DEZEMBRO</option>
                    </select>
                </div>
            </div>
        </section>
    </main>
    <!-- JavaScript principal -->
    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./service-worker.js")
                    .then(registration => {
                        console.log("Service Worker registrado:", registration.scope);
                    })
                    .catch(error => {
                        console.error(
                            "Erro ao registrar Service Worker:", error
                        );
                    });
            });
        }
    </script>    
</body>
</html>
